<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Typing Animation....</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #111;
        color: #00ffcc;
        font-family: monospace;
        font-size: 1.5rem;
      }

      .wrapper {
        display: flex;
        align-items: center;
      }

      .static-text {
        margin-right: 10px;
      }

      .dynamic-text {
        border-right: 3px solid #00ffcc;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="static-text">I'm a</div>
      <div class="dynamic-text" id="typing"></div>
    </div>

    <script>
      const roles = [
        "Computer Engineer",
        "Software Developer",
        "Webpage Developer",
        "Machine Learning Enthusiast",
        "Data Engineer",
      ];

      const typingElement = document.getElementById("typing");
      let roleIndex = 0;
      let charIndex = 0;
      let isDeleting = false;

      function typeEffect() {
        const currentRole = roles[roleIndex];
        if (!isDeleting) {
          typingElement.textContent = currentRole.substring(0, charIndex + 1);
          charIndex++;
          if (charIndex === currentRole.length) {
            isDeleting = true;
            setTimeout(typeEffect, 1500); // pause before deleting
            return;
          }
        } else {
          typingElement.textContent = currentRole.substring(0, charIndex - 1);
          charIndex--;
          if (charIndex === 0) {
            isDeleting = false;
            roleIndex = (roleIndex + 1) % roles.length;
          }
        }
        const speed = isDeleting ? 50 : 100; // typing vs deleting speed
        setTimeout(typeEffect, speed);
      }

      typeEffect();
    </script>
  </body>
</html>
