<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link
      rel="shortcut icon"
      href="/my-portfolio/images/favicon.svg"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="logo">Lelin</div>

      <ul class="nav-links" id="navLinks">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>

      <div class="nav-right">
        <button id="darkToggle">🌙</button>
        <div class="menu-toggle" id="menuToggle">☰</div>
      </div>
    </nav>

    <!-- HERO -->
    <section id="home" class="hero"></section>
    <script>
      fetch("/my-portfolio/Components/Hero.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("home").innerHTML = data;
        });
    </script>

    <!-- SKILLS -->
    <section id="skills" class="skills reveal">
      <h2>Skills</h2>

      <div class="skill">
        <p>HTML</p>
        <div class="bar"><span style="width: 90%"></span></div>
      </div>

      <div class="skill">
        <p>CSS</p>
        <div class="bar"><span style="width: 85%"></span></div>
      </div>

      <div class="skill">
        <p>JavaScript</p>
        <div class="bar"><span style="width: 75%"></span></div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="projects reveal">
      <h2>Projects</h2>

      <div class="project-container">
        <div class="card">
          <img src="images/project1.jpg" />
          <h3>Portfolio Website</h3>
          <p>Responsive personal portfolio</p>
          <a href="#" class="github">GitHub</a>
        </div>

        <div class="card">
          <img src="images/project2.jpg" />
          <h3>Login Form</h3>
          <p>Modern login UI</p>
          <a href="#" class="github">GitHub</a>
        </div>

        <div class="card">
          <img src="images/project3.jpg" />
          <h3>Stock Bar</h3>
          <p>Animated stock bar</p>
          <a href="#" class="github">GitHub</a>
        </div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="contact reveal">
      <h2>Contact</h2>
      <form id="contactForm">
        <input type="text" placeholder="Name" required />
        <input type="email" placeholder="Email" required />
        <textarea placeholder="Message"></textarea>
        <button type="submit">Send</button>
      </form>
    </section>

    <footer>
      <p>© 2026 Lelin</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
